name: Build Android APK

# Builds an installable release APK and uploads it as a workflow artifact.
# Pushing a tag like v1.2.0 also attaches the APK to a GitHub Release.
#
# Optional repository secrets:
#   EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID / _IOS_ / _WEB_  - Google Drive sign-in
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD               - sign with your own key
# Without a keystore the APK is signed with the debug key: fine for testing and
# sideloading, but not for the Play Store. Updates require the same signing key.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['site/**', '**/*.md', '.github/workflows/pages.yml', '.github/workflows/ci.yml']
  pull_request:
    paths-ignore: ['site/**', '**/*.md', '.github/workflows/pages.yml', '.github/workflows/ci.yml']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish releases on tags

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME); fail fast if not.
      - name: Check Android SDK
        run: |
          test -n "$ANDROID_HOME" && test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Let PR builds save caches too (default is main-only), so repeat PR builds are warm.
          cache-read-only: false

      # Native (C/C++) compilation of React Native libraries is most of the build time.
      # ccache reuses object files across runs when sources haven't changed.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ hashFiles('package-lock.json') }}
          restore-keys: android-
          max-size: 2G

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Tune Gradle for CI
        run: |
          # Prebuild's last line has no trailing newline; start on a fresh line.
          echo >> android/gradle.properties
          cat >> android/gradle.properties <<'PROPS'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          PROPS

      # PRs: your phone (arm64) + the emulator (x86_64). main/tags: every architecture.
      - name: Choose architectures
        id: abi
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=arm64-v8a,x86_64" >> "$GITHUB_OUTPUT"
          else
            echo "list=arm64-v8a,armeabi-v7a,x86_64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --build-cache --parallel -PreactNativeArchitectures=${{ steps.abi.outputs.list }} 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the failure as annotations (readable without log access).
            grep -E "What went wrong|FAILURE|error:|Error:|Exception|> " "$RUNNER_TEMP/gradle.log" | grep -v "^> Task" | head -30 | while IFS= read -r l; do echo "::error title=Gradle::${l//%/%25}"; done
            exit 1
          fi
          ccache --show-stats || true

      - name: Sign with release keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No keystore secret: keeping debug-signed APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$APK"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Name artifact
        id: name
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "file=DocVault-${VERSION}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "DocVault-${VERSION}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DocVault-apk
          path: ${{ steps.name.outputs.file }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
          generate_release_notes: true

  smoke-test:
    # Boots an emulator, installs the APK and checks the app survives startup.
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DocVault-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/android-smoke.sh "$(ls apk/*.apk | head -1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-logs
          path: |
            logcat.txt
            smoke.png
          if-no-files-found: ignore
